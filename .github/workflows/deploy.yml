name: Deploy to GitHub Pages

# main へ push すると、テスト → ビルド → GitHub Pages へ公開する。
# 事前に リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc --noEmit + vite build。アセットは相対パス (base: './') なのでリポジトリ名のサブパスでも動く。
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
